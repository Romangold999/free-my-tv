name: Geely YouTube Android build

on:
  push:
    branches: [geely-youtube-dpi]
    paths:
      - 'geely-youtube-dpi/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geely-youtube-dpi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geely-youtube-debug-apk
          path: geely-youtube-dpi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
