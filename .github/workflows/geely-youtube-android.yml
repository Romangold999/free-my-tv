name: Geely YouTube Android build

on:
  push:
    branches: [geely-youtube-dpi]
    paths:
      - 'geely-youtube-dpi/**'
      - '.github/workflows/geely-youtube-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geely-youtube-dpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned ByeDPI native dependency
        run: |
          git clone https://github.com/dovecoteescapee/ByeDPIAndroid.git third_party/ByeDPIAndroid
          git -C third_party/ByeDPIAndroid checkout --detach 43db0955de687d43f9473374dc7c5548eaa55359
          git -C third_party/ByeDPIAndroid submodule update --init --recursive
          mkdir -p geely-youtube-dpi/app/src/main/cpp/byedpi
          cp -a third_party/ByeDPIAndroid/app/src/main/cpp/byedpi/. geely-youtube-dpi/app/src/main/cpp/byedpi/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("geely-youtube-dpi/app/src/main/cpp/byedpi/main.c")
          lines = p.read_text().splitlines()
          sig = next((i for i, line in enumerate(lines) if line.startswith("int parse_args(int argc, char **argv)")), None)
          if sig is None or lines[sig + 1].strip() != "{":
              raise SystemExit("Could not locate ByeDPI parser signature")
          lines[sig + 2:sig + 2] = ["    optind = 1;", "    opterr = 0;"]
          tail = next((i for i, line in enumerate(lines) if "int status = run((struct sockaddr_ina *)&params.laddr);" in line), None)
          if tail is None or "clear_params();" not in lines[tail + 1] or "return status;" not in lines[tail + 2]:
              raise SystemExit("Could not locate ByeDPI main() tail")
          lines[tail:tail + 3] = ["    return 0;"]
          p.write_text("\n".join(lines) + "\n")
          PY
      - name: Verify original ByeDPI baseline consistency
        run: |
          EXPECTED='-Ku -a3 -An -Kt,h -n vk.com -d1 -d3+s -s6+s -d9+s -s12+s -d15+s -s20+s -d25+s -s30+s -d35+s -r1+s -S -Mh,d -As -Kt,h -n vk.com -d1 -d3+s -s6+s -d9+s -s12+s -d15+s -d20+s -d25+s -d30+s -d35+s -S -Mh,d'
          test "$(cat geely-youtube-dpi/profiles/user-supplied-youtube.txt)" = "$EXPECTED"
          grep -Fq "private val defaultArgs = \"$EXPECTED\"" geely-youtube-dpi/app/src/main/java/com/romgold/geelyyoutube/MainActivity.kt
      - name: Build debug APK
        working-directory: geely-youtube-dpi
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package and native ABIs
        run: |
          APK="geely-youtube-dpi/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          CONTENTS="$(unzip -Z1 "$APK")"
          for LICENSE in assets/licenses/GPL-3.0.txt assets/licenses/ByeDPI-MIT.txt assets/licenses/THIRD-PARTY-NOTICES.txt; do
            echo "$CONTENTS" | grep -qx "$LICENSE"
          done
          for ABI in armeabi-v7a arm64-v8a; do
            echo "$CONTENTS" | grep -qx "lib/$ABI/libbyedpi.so"
            unzip -p "$APK" "lib/$ABI/libbyedpi.so" > "/tmp/libbyedpi-$ABI.so"
            for SYMBOL in \
              Java_io_github_dovecoteescapee_byedpi_core_ByeDpiProxy_jniCreateSocketWithCommandLine \
              Java_io_github_dovecoteescapee_byedpi_core_ByeDpiProxy_jniStartProxy \
              Java_io_github_dovecoteescapee_byedpi_core_ByeDpiProxy_jniStopProxy \
              Java_io_github_dovecoteescapee_byedpi_core_ByeDpiProxy_jniResetProxyState; do
              readelf --dyn-syms --wide "/tmp/libbyedpi-$ABI.so" | grep -Fq "$SYMBOL"
            done
          done
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.romgold.geelyyoutube' versionCode='2' versionName='0.2.0'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'21'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'28'"
      - uses: actions/upload-artifact@v4
        with:
          name: geely-youtube-debug-apk
          path: geely-youtube-dpi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
