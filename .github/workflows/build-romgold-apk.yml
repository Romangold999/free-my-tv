name: Build custom Free My TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - custom/weather-screensaver-apk
      - custom/blue-weather-dynamic-photos

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: romgold-freemytv-signing-v1
      - name: Prepare independent app and requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Give this build its own Android application ID so it installs beside the original.
          for root in (Path("app"),):
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  try:
                      s = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if "io.freemytv" in s:
                      p.write_text(s.replace("io.freemytv", "io.romgold.freemytv.blue"), encoding="utf-8")

          build_script = Path("build.sh")
          bs = build_script.read_text(encoding="utf-8")
          build_script.write_text(bs.replace("package io.freemytv;", "package io.romgold.freemytv.blue;"), encoding="utf-8")
          manifest = Path("app/AndroidManifest.xml")
          s = manifest.read_text(encoding="utf-8")
          s = s.replace('android:versionCode="5"', 'android:versionCode="9"')
          s = s.replace('android:versionName="1.4"', 'android:versionName="1.5.1-blue"')
          s = s.replace('android:label="Free My TV"', 'android:label="Free My TV Blue"')
          manifest.write_text(s, encoding="utf-8")

          # Change the slideshow cadence from 30 seconds to five minutes.
          dream = Path("app/src/io/freemytv/DreamView.java")
          s = dream.read_text(encoding="utf-8")
          old = "private static final long SHOW_MS = 30_000, FADE_MS = 3_000, FIRST_MS = 1_600;"
          new = "private static final long SHOW_MS = 300_000, FADE_MS = 3_000, FIRST_MS = 1_600;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Could not locate a known screensaver interval; refusing an unverified patch.")
          dream.write_text(s, encoding="utf-8")
          PY
      - name: Build APK
        run: |
          chmod +x build.sh
          ./build.sh --generic
          cp FreeMyTV.apk FreeMyTV-Blue.apk
      - name: Verify package identity and APK alignment
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging FreeMyTV-Romgold.apk | grep -E "^package:|^application-label:"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 FreeMyTV-Romgold.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Blue-APK
          path: FreeMyTV-Romgold.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: romgold-blue-apk-1.5.1-20261110
          name: FreeMyTV Romgold 1.4.1
          body: Standalone Free My TV Blue build with a distinct Android package ID. Installs alongside the existing app.
          files: FreeMyTV-Romgold.apk
          fail_on_unmatched_files: true
