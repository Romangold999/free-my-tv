name: Build Bluetooth Air Mouse APK

on:
  push:
    branches:
      - app/bluetooth-air-mouse-standalone
    paths:
      - 'air-mouse/**'
      - '.github/workflows/build-air-mouse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: air-mouse
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p release
          cp air-mouse/app/build/outputs/apk/debug/app-debug.apk release/AirMouse-Bluetooth.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirMouse-Bluetooth-APK
          path: release/AirMouse-Bluetooth.apk
          if-no-files-found: error
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airmouse-bluetooth-v1.0.1-20261110
          name: Air Mouse Bluetooth v1.0.1
          files: release/AirMouse-Bluetooth.apk
          make_latest: false
          generate_release_notes: false
