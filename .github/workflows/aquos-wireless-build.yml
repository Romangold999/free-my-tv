name: AQUOS Wireless Hub build
on:
  push:
    branches: [aquos/wireless-control-center]
    paths: ['aquos-wireless/**', '.github/workflows/aquos-wireless-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle -p aquos-wireless assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AQUOS-Wireless-Hub-debug
          path: aquos-wireless/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
